name: Package Locales

on:
  push:

jobs:
  package:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        locale:
          - cs
          - de
          - fr
          - nl
          - sl
          - tr
          - zh_Hant

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Create locale package (PO files)
        run: |
          python scripts/package.py locales/${{ matrix.locale }} -o out/

      - name: Upload packages as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.locale }}-locale
          path: out/

  update:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        locale:
          - cs
          - de
          - fr
          - nl
          - sl
          - tr
          - zh_Hant

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Create locale package (PO files)
        run: |
          python scripts/package.py locales/${{ matrix.locale }} -o out/

      - name: Push to DSW
        # Uploading a PO file replaces the existing locale with the same code
        run: |
          python scripts/dsw-locales.py push out/wizard.po out/mail.po -e
        env:
          DSW_API_URL: ${{ secrets.TRANSLATORS_DSW_API_URL }}
          DSW_API_KEY: ${{ secrets.TRANSLATORS_DSW_API_KEY }}
