name: Release Locale

on:
  push:
    tags:
      - v*

jobs:
  package:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Extract tag
        run: |
          echo "TAG=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      - name: Extract version
        run: |
          VERSION=$(echo $TAG | sed 's/^v\([0-9]*\.[0-9]*\.[0-9]*\)-.*$/\1/')
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Extract language code
        run: |
          LANG=$(echo $TAG | sed 's/^v[0-9]*\.[0-9]*\.[0-9]*-\(.*\)$/\1/')
          echo "LANG=${LANG}" >> $GITHUB_ENV

      - name: Check locale to release
        run: |
          ls -lah locales/$LANG

      - name: Create locale package (PO files)
        run: |
          python scripts/package.py locales/$LANG -o out/ -p dsw_${{ env.LANG }}_${{ env.VERSION }}_

      - name: Create release and upload PO files
        uses: ncipollo/release-action@v1
        id: create_release
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: "out/*.po"
          artifactContentType: text/x-gettext-translation
          replacesArtifacts: true

  push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Extract tag
        run: |
          echo "TAG=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      - name: Extract language code
        run: |
          LANG=$(echo $TAG | sed 's/^v[0-9]*\.[0-9]*\.[0-9]*-\(.*\)$/\1/')
          echo "LANG=${LANG}" >> $GITHUB_ENV

      - name: Check locale to release
        run: |
          ls -lah locales/$LANG

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Create locale package (PO files)
        run: |
          python scripts/package.py locales/$LANG -o out/

      - name: Push to DSW
        # Uploading a PO file replaces the existing locale with the same code
        run: |
          python scripts/dsw-locales.py push out/wizard.po out/mail.po -e
        env:
          DSW_API_URL: ${{ secrets.INTERNAL_DSW_API_URL }}
          DSW_API_KEY: ${{ secrets.INTERNAL_DSW_API_KEY }}
